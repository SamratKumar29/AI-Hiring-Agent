<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <!-- Definitions -->
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1D4ED8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E3A8A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-secondary" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B91C1C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-supabase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3ECF8E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2AA873;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-careerops" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5B21B6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-resume" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EA580C;stop-opacity:1" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetblur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4B5563" />
    </marker>

    <!-- Dashed arrow marker -->
    <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9CA3AF" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="900" fill="#F0F0E8"/>

  <!-- Title -->
  <text x="700" y="40" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#000000" text-anchor="middle">AI Hiring Agent — System Architecture</text>
  <text x="700" y="65" font-family="system-ui, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">Based on AGENT_SETUP.md — Combined job-search pipeline</text>

  <!-- ============================================================
       LAYER 1: SCRAPERS (Top Row)
       ============================================================ -->

  <!-- anandanair/job-scraper -->
  <g filter="url(#dropShadow)">
    <rect x="80" y="120" width="280" height="140" rx="8" fill="white" stroke="#1D4ED8" stroke-width="2"/>
    <rect x="80" y="120" width="280" height="40" rx="8" fill="url(#grad-primary)"/>
    <text x="220" y="145" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">anandanair/job-scraper</text>
    <text x="220" y="162" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)" text-anchor="middle">Local, on-demand LinkedIn</text>

    <text x="220" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">🔍 Manual trigger</text>
    <text x="220" y="212" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">📝 scraper.py → score_jobs.py</text>
    <text x="220" y="229" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">⚙️ Python + Supabase</text>
  </g>

  <!-- Kurt-Chan/ai-job-scraper -->
  <g filter="url(#dropShadow)">
    <rect x="560" y="120" width="280" height="140" rx="8" fill="white" stroke="#1D4ED8" stroke-width="2"/>
    <rect x="560" y="120" width="280" height="40" rx="8" fill="url(#grad-primary)"/>
    <text x="700" y="145" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Kurt-Chan/ai-job-scraper</text>
    <text x="700" y="162" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)" text-anchor="middle">Scheduled multi-board discovery</text>

    <text x="700" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">⏰ GitHub Actions schedule</text>
    <text x="700" y="212" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">📝 agent.py → sync script</text>
    <text x="700" y="229" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">⚙️ Python + Supabase</text>
  </g>

  <!-- career-ops scan.mjs (portal scanner) -->
  <g filter="url(#dropShadow)">
    <rect x="1040" y="120" width="280" height="140" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/>
    <rect x="1040" y="120" width="280" height="40" rx="8" fill="url(#grad-careerops)"/>
    <text x="1180" y="145" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">career-ops scan.mjs</text>
    <text x="1180" y="162" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)" text-anchor="middle">Zero-token portal scanner</text>

    <text x="1180" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">🌐 Greenhouse/Ashby/Lever</text>
    <text x="1180" y="212" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">📝 Node.js + Playwright</text>
    <text x="1180" y="229" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">⚙️ Direct to pipeline.md</text>
  </g>

  <!-- ============================================================
       LAYER 2: SUPABASE (Center)
       ============================================================ -->
  <g filter="url(#dropShadow)">
    <rect x="450" y="290" width="500" height="120" rx="12" fill="white" stroke="#3ECF8E" stroke-width="3"/>
    <rect x="450" y="290" width="500" height="38" rx="12" fill="url(#grad-supabase)"/>
    <text x="700" y="313" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="white" text-anchor="middle">Supabase "jobs" Table</text>
    <text x="700" y="328" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)" text-anchor="middle">Shared Discovery Inbox</text>

    <text x="700" y="358" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">Columns: job_url, source, salary_text, synced_to_pipeline, ...</text>
    <text x="700" y="375" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">Free tier • PostgreSQL • Real-time subscriptions</text>
    <text x="700" y="392" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Receives writes from all 3 discovery sources</text>
  </g>

  <!-- Arrows from scrapers to Supabase -->
  <path d="M 220 260 L 220 290" stroke="#1D4ED8" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 700 260 L 700 290" stroke="#1D4ED8" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1180 260 L 1180 290" stroke="#7C3AED" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- ============================================================
       LAYER 3: SYNC PIPELINE
       ============================================================ -->
  <g filter="url(#dropShadow)">
    <rect x="550" y="435" width="300" height="80" rx="8" fill="white" stroke="#F97316" stroke-width="2"/>
    <rect x="550" y="435" width="300" height="32" rx="8" fill="url(#grad-accent)"/>
    <text x="700" y="455" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">integration/sync-pipeline.mjs</text>

    <text x="700" y="485" font-family="system-ui, sans-serif" font-size="10" fill="#374151" text-anchor="middle">Reads unsynced rows → Appends to career-ops/data/pipeline.md</text>
    <text x="700" y="500" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Node.js • @supabase/supabase-js • Runs manually or scheduled</text>
  </g>

  <!-- Arrow Supabase to sync -->
  <path d="M 700 410 L 700 435" stroke="#3ECF8E" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- ============================================================
       LAYER 4: CAREER-OPS PIPELINE

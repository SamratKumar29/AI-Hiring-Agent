       LAYER 5: DUAL CV GENERATION
       ============================================================ -->
  <g filter="url(#dropShadow)">
    <rect x="500" y="545" width="400" height="160" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/>
    <rect x="500" y="545" width="400" height="38" rx="8" fill="url(#grad-accent)"/>
    <text x="700" y="568" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Dual CV Generation (You pick the better)</text>

    <!-- Path A -->
    <rect x="520" y="595" width="175" height="95" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
    <text x="607" y="612" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#DC2626" text-anchor="middle">A) career-ops Built-in</text>
    <text x="607" y="627" font-family="system-ui, sans-serif" font-size="9" fill="#374151" text-anchor="middle">CV generator (HTML/LaTeX)</text>
    <text x="607" y="640" font-family="system-ui, sans-serif" font-size="9" fill="#374151" text-anchor="middle">generate-pdf.mjs</text>
    <text x="607" y="653" font-family="system-ui, sans-serif" font-size="9" fill="#374151" text-anchor="middle">generate-latex.mjs</text>
    <text x="607" y="666" font-family="system-ui, sans-serif" font-size="9" fill="#374151" text-anchor="middle">Playwright → PDF</text>

    <!-- Path B -->
    <rect x="705" y="595" width="175" height="95" rx="6" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1"/>
    <text x="792" y="612" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#F97316" text-anchor="middle">B) Resume-Matcher</text>
    <text x="792" y="627" font-family="system-ui, sans-serif" font-size="9" fill="#374151" text-anchor="middle">FastAPI + Next.js</text>
    <text x="792" y="640" font-family="system-ui, sans-serif" font-size="9" fill="#374151" text-anchor="middle">Diff-based tailoring</text>
    <text x="792" y="653" font-family="system-ui, sans-serif" font-size="9" fill="#374151" text-anchor="middle">markitdown + Playwright</text>
    <text x="792" y="666" font-family="system-ui, sans-serif" font-size="9" fill="#374151" text-anchor="middle">Local SQLite DB</text>
  </g>

  <!-- Arrow career-ops to dual CV -->
  <path d="M 400 625 L 500 625" stroke="#7C3AED" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- ============================================================
       LAYER 6: APPLICATION SUPPORT
       ============================================================ -->
  <g filter="url(#dropShadow)">
    <rect x="500" y="725" width="400" height="100" rx="8" fill="white" stroke="#059669" stroke-width="2"/>
    <rect x="500" y="725" width="400" height="32" rx="8" fill="url(#grad-secondary)"/>
    <text x="700" y="745" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Application Support Modes (run as needed, per application)</text>

    <text x="700" y="770" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">📄 cover.md — Cover letter generation</text>
    <text x="700" y="785" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">🎯 interview-prep.md — Interview preparation & debrief</text>
    <text x="700" y="800" font-family="system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">💰 offer-prep.md — Offer analysis & negotiation prep</text>
    <text x="700" y="815" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">All use your profile (cv.md, modes/_profile.md, config/profile.yml)</text>
  </g>

  <!-- Arrow dual CV to support -->
  <path d="M 700 705 L 700 725" stroke="#DC2626" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- ============================================================
       SIDE: MANUAL/ONE-OFF PATHS
       ============================================================ -->
  <g filter="url(#dropShadow)">
    <rect x="960" y="545" width="360" height="280" rx="8" fill="white" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="8,4"/>
    <rect x="960" y="545" width="360" height="32" rx="8" fill="#F3F4F6"/>
    <text x="1140" y="565" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#4B5563" text-anchor="middle">One-off / Manual Paths</text>

    <text x="1140" y="595" font-family="system-ui, sans-serif" font-size="10" fill="#374151" text-anchor="middle">🔗 Drop URL into career-ops/data/pipeline.md</text>
    <text x="1140" y="610" font-family="system-ui, sans-serif" font-size="10" fill="#374151" text-anchor="middle">   under ## Pending → /career-ops pipeline</text>

    <text x="1140" y="635" font-family="system-ui, sans-serif" font-size="10" fill="#374151" text-anchor="middle">🔗 job-scraper/evaluate_job.py --url \"...\"</text>
    <text x="1140" y="650" font-family="system-ui, sans-serif" font-size="10" fill="#374151" text-anchor="middle">   Standalone quick score (no scraping)</text>

    <text x="1140" y="675" font-family="system-ui, sans-serif" font-size="10" fill="#374151" text-anchor="middle">🔗 Resume-Matcher: Feed cv.md + JD text</text>
    <text x="1140" y="690" font-family="system-ui, sans-serif" font-size="10" fill="#374151" text-anchor="middle">   Manual web UI for 2nd opinion CV</text>

    <text x="1140" y="715" font-family="system-ui, sans-serif" font-size="10" fill="#374151" text-anchor="middle">🔗 Naukri / Michael Page / Multi-Recruit</text>
    <text x="1140" y="730" font-family="system-ui, sans-serif" font-size="10" fill="#374151" text-anchor="middle">   Not yet scraped — add provider module</text>

    <text x="1140" y="755" font-family="system-ui, sans-serif" font-size="10" fill="#374151" text-anchor="middle">🔗 Dedup: dedup-tracker.mjs / detect-reposts.mjs</text>
    <text x="1140" y="770" font-family="system-ui, sans-serif" font-size="10" fill="#374151" text-anchor="middle">   Catches cross-listed postings automatically</text>

    <text x="1140" y="795" font-family="system-ui, sans-serif" font-size="9" fill="#9CA3AF" text-anchor="middle">Dashed = optional / manual / future</text>
  </g>

  <!-- Arrow career-ops to manual paths (dashed) -->
  <path d="M 400 650 L 960 650" stroke="#9CA3AF" stroke-width="1.5" fill="none" marker-end="url(#arrowhead-dashed)" stroke-dasharray="6,3"/>

  <!-- ============================================================
       LEGEND
       ============================================================ -->
  <g font-family="system-ui, sans-serif" font-size="10">
    <rect x="80" y="855" width="1200" height="35" rx="4" fill="white" stroke="#E5E7EB" stroke-width="1"/>

    <circle cx="120" cy="872" r="6" fill="url(#grad-primary)"/>
    <text x="135" y="876" fill="#374151">Discovery Scrapers (Python)</text>

    <circle cx="320" cy="872" r="6" fill="url(#grad-careerops)"/>
    <text x="335" y="876" fill="#374151">career-ops (Node.js/TypeScript)</text>

    <circle cx="570" cy="872" r="6" fill="url(#grad-supabase)"/>
    <text x="585" y="876" fill="#374151">Supabase (Shared PostgreSQL)</text>

    <circle cx="800" cy="872" r="6" fill="url(#grad-accent)"/>
    <text x="815" y="876" fill="#374151">Sync / Pipeline Glue</text>

    <circle cx="1000" cy="872" r="6" fill="url(#grad-resume)"/>
    <text x="1015" y="876" fill="#374151">CV Generation (Dual Path)</text>

    <circle cx="1200" cy="872" r="6" fill="url(#grad-secondary)"/>
    <text x="1215" y="876" fill="#374151">Application Support</text>
  </g>

</svg>
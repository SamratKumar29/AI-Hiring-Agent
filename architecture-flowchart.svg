    <text x="240" y="625" font-family="system-ui, sans-serif" font-size="10" fill="#374151" text-anchor="middle">🤖 /career-ops pipeline</text>
    <text x="240" y="640" font-family="system-ui, sans-serif" font-size="10" fill="#374151" text-anchor="middle">📊 Evaluation (Blocks A-F + G)</text>
    <text x="240" y="655" font-family="system-ui, sans-serif" font-size="10" fill="#374151" text-anchor="middle">📈 Ranks by fit + your profile</text>
    <text x="240" y="670" font-family="system-ui, sans-serif" font-size="10" fill="#374151" text-anchor="middle">📝 Reports + Tracker update</text>
    <text x="240" y="685" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">LLM: OpenRouter via openai-eval.mjs</text>
  </g>

  <!-- Arrow sync to career-ops -->
  <path d="M 700 515 L 240 545" stroke="#F97316" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

